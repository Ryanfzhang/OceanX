<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1280" viewBox="0 0 1680 1280" role="img" aria-labelledby="title desc">
  <title id="title">OceanX: research execution and cross-task improvement</title>
  <desc id="desc">The Coordinator maintains a research tree, delegates to Ocean, Statistics and Search Experts, and consults a Discussion Partner. Data Experts use isolated workspaces and persistent Python kernels. Role-scoped skills and Python helper functions support execution. Saved evidence returns to the Coordinator for decisions and final synthesis. Completed records feed an offline meta-agent, which updates lessons and tested helper functions for subsequent tasks. Benchmark libraries remain frozen.</desc>
  <defs>
    <style>
      text {font-family:Helvetica,Arial,sans-serif; fill:#183143}
      .title {font-size:44px; font-weight:700; letter-spacing:-1.5px}
      .subtitle {font-size:21px; fill:#61717d}
      .panel {font-size:25px; font-weight:700; letter-spacing:-.5px}
      .kicker {font-size:14px; font-weight:700; letter-spacing:2px; fill:#607484}
      .node {font-size:24px; font-weight:700; letter-spacing:-.4px}
      .body {font-size:18px; fill:#506472}
      .small {font-size:16px; fill:#657784}
      .white {fill:#fff}
      .onblue {fill:#dce8f0}
      .inkline {fill:none;stroke:#37576d;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      .guidance {fill:none;stroke:#ba904d;stroke-width:2;stroke-dasharray:5 6;stroke-linejoin:round}
      .archive {fill:none;stroke:#93a2ab;stroke-width:1.8;stroke-dasharray:5 6;stroke-linejoin:round}
      .feedback {fill:none;stroke:#ba904d;stroke-width:2;stroke-dasharray:6 7;stroke-linejoin:round}
    </style>
